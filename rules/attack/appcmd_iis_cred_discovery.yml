title: Découverte de secrets IIS via appcmd.exe
id: lab-appcmd-cred
status: experimental
description: >
  appcmd.exe interrogé pour lire les identifiants d'un pool d'applications IIS
  (processModel.password / username). Technique d'accès aux identifiants.
references:
  - https://attack.mitre.org/techniques/T1552/001/
tags:
  - attack.credential_access
  - attack.t1552.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\appcmd.exe'
    CommandLine|contains:
      - 'processmodel.password'
      - 'processmodel.username'
  condition: selection
level: high
