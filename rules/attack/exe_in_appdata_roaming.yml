title: Exécutable lancé depuis AppData\Roaming
id: lab-exe-appdata
status: experimental
description: >
  Un exécutable démarre depuis AppData\Roaming. Des logiciels légitimes y vivent
  (messagerie, visio), donc cette règle est BRUYANTE telle quelle : elle sert de
  support à la démonstration du réglage par exclusions (voir rules/benign_tuning).
references:
  - https://attack.mitre.org/techniques/T1547/004/
tags:
  - attack.persistence
  - attack.t1547.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|contains: '\AppData\Roaming\'
    Image|endswith: '.exe'
  condition: selection
level: medium
